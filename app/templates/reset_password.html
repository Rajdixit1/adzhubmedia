{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block auth %}
<div class="card">
  <h2>Reset password</h2>
  <form method="post" action="/reset-password" class="stack">
    <div><label>OTP</label><input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus></div>
    <div><label>New password</label><input type="password" name="new_password" minlength="6" required></div>
    <div><label>Confirm new password</label><input type="password" name="confirm_password" minlength="6" required></div>
    <button class="btn" type="submit" style="width:100%">Reset password</button>
  </form>
  <p class="center muted"><a href="/forgot-password">Resend OTP</a> · <a href="/login">Back to login</a></p>
</div>
{% endblock %}
