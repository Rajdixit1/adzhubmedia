{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block auth %}
<div class="card">
  <div class="tabs">
    <a href="/login?role=publisher" class="{{ 'active' if role == 'publisher' }}">Publisher</a>
    <a href="/login?role=advertiser" class="{{ 'active' if role == 'advertiser' }}">Advertiser</a>
    <a href="/login?role=ca" class="{{ 'active' if role == 'ca' }}">CA</a>
    <a href="/login?role=admin" class="{{ 'active' if role == 'admin' }}">Admin</a>
  </div>
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="role" value="{{ role }}">
    <div><label>Email</label><input type="email" name="email" required autofocus></div>
    <div><label>Password</label><input type="password" name="password" required></div>
    <button class="btn" type="submit" style="width:100%">Login as {{ 'CA' if role == 'ca' else role | capitalize }}</button>
  </form>
  {% if role == 'ca' %}
  <p class="center muted">CA accounts are created by the admin.</p>
  {% elif role != 'admin' %}
  <p class="center muted">New {{ role }}? <a href="/register?role={{ role }}">Create an account</a></p>
  {% endif %}
</div>
{% endblock %}
