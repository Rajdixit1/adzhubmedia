{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block auth %}
<div class="card">
  <h2>Forgot password</h2>
  <p class="muted">Enter your registered email or phone number. We will send a 6-digit OTP to your registered email and WhatsApp.</p>
  <form method="post" action="/forgot-password" class="stack">
    <input type="hidden" name="role" value="{{ role }}">
    <div><label>Email or phone number</label><input name="identifier" required autofocus></div>
    <button class="btn" type="submit" style="width:100%">Send OTP</button>
  </form>
  <p class="center muted"><a href="/reset-password">I already have an OTP</a> · <a href="/login?role={{ role }}">Back to login</a></p>
</div>
{% endblock %}
