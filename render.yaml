services:
  - type: web
    name: adzhubmedia
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DATABASE_URL
        fromDatabase:
          name: adzhubmedia-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@adzhubmedia.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_TLS
        value: "true"
      - key: MAIL_FROM
        value: no-reply@adzhubmedia.com
      - key: WHATSAPP_PROVIDER
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: META_WA_TOKEN
        sync: false
      - key: META_WA_PHONE_ID
        sync: false
      - key: DEFAULT_COUNTRY_CODE
        value: "91"
      - key: MAX_UPLOAD_MB
        value: "10"

databases:
  - name: adzhubmedia-db
    plan: free
    databaseName: adzhubmedia
    user: adzhubmedia
